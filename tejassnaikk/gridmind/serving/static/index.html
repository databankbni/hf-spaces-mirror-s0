<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridMind — NERC CIP Compliance Q&amp;A</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  background: #eef1f6;
  color: #1a1a2e;
  min-height: 100vh;
  padding: 2.5rem 1rem 4rem;
}

.container {
  max-width: 720px;
  margin: 0 auto;
}

header {
  text-align: center;
  margin-bottom: 1.75rem;
}

header h1 {
  font-size: 2rem;
  font-weight: 700;
  color: #0f2d52;
  letter-spacing: -0.5px;
}

header p {
  font-size: 0.88rem;
  color: #5e6e82;
  margin-top: 0.35rem;
}

.card {
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.08);
  padding: 1.75rem;
}

/* ── examples ─────────────────────────────────────────────────────────── */
.examples-label {
  display: block;
  font-size: 0.72rem;
  font-weight: 600;
  color: #9ca3af;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  margin-bottom: 0.5rem;
}

.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-bottom: 1.1rem;
}

.example-btn {
  font-size: 0.8rem;
  padding: 0.32rem 0.75rem;
  border: 1.5px solid #c9d8ea;
  border-radius: 999px;
  background: #f4f7fb;
  color: #1f4e79;
  cursor: pointer;
  transition: background 0.14s, border-color 0.14s;
  white-space: nowrap;
}

.example-btn:hover { background: #dbeafe; border-color: #3b82f6; }

/* ── question input ────────────────────────────────────────────────────── */
textarea {
  width: 100%;
  min-height: 78px;
  padding: 0.7rem 0.85rem;
  border: 1.5px solid #d1d5db;
  border-radius: 9px;
  font-family: inherit;
  font-size: 0.95rem;
  resize: vertical;
  outline: none;
  color: #111827;
  transition: border-color 0.15s;
  line-height: 1.5;
}

textarea:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }

/* ── ask row ───────────────────────────────────────────────────────────── */
.ask-row {
  display: flex;
  align-items: center;
  gap: 0.85rem;
  margin-top: 0.75rem;
}

#ask-btn {
  padding: 0.58rem 1.6rem;
  background: #1a5fa8;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 0.92rem;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.14s;
  white-space: nowrap;
}

#ask-btn:hover:not(:disabled) { background: #154d8a; }

#ask-btn:disabled {
  background: #93b8d8;
  cursor: not-allowed;
}

#status {
  font-size: 0.83rem;
  color: #6b7280;
  font-style: italic;
  min-height: 1.2em;
}

/* ── error ─────────────────────────────────────────────────────────────── */
#error {
  margin-top: 1rem;
  padding: 0.7rem 1rem;
  background: #fef2f2;
  border: 1.5px solid #fca5a5;
  border-radius: 8px;
  color: #b91c1c;
  font-size: 0.88rem;
  line-height: 1.5;
}

/* ── answer ────────────────────────────────────────────────────────────── */
#result {
  margin-top: 1.5rem;
  border-top: 1px solid #e5e7eb;
  padding-top: 1.25rem;
}

#answer {
  font-size: 0.95rem;
  line-height: 1.7;
  color: #1f2937;
  white-space: pre-wrap;
}

/* citation badges — amber, monospaced, match standard [xxxxxxxx] format */
mark.cite {
  background: #fef3c7;
  color: #78350f;
  border: 1px solid #f59e0b;
  border-radius: 4px;
  padding: 1px 5px;
  font-family: 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
  font-size: 0.76rem;
  font-weight: 700;
  white-space: nowrap;
}

/* ── sources collapsible ────────────────────────────────────────────────── */
#sources-details {
  margin-top: 1.25rem;
}

summary {
  font-size: 0.85rem;
  font-weight: 600;
  color: #374151;
  cursor: pointer;
  user-select: none;
  padding: 0.35rem 0;
  list-style: none;        /* hide default triangle in Firefox */
}

summary::-webkit-details-marker { display: none; }

summary::before {
  content: '▶ ';
  font-size: 0.7rem;
  color: #9ca3af;
  transition: transform 0.15s;
  display: inline-block;
}

details[open] summary::before { content: '▼ '; }

summary:hover { color: #1a5fa8; }

.source {
  margin-top: 0.65rem;
  border: 1.5px solid #e5e7eb;
  border-radius: 9px;
  overflow: hidden;
}

.source-header {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.45rem 0.65rem;
  padding: 0.55rem 0.85rem;
  background: #f9fafb;
  border-bottom: 1px solid #e5e7eb;
  font-size: 0.82rem;
}

.source-rank  { color: #9ca3af; font-size: 0.75rem; }
.source-std   { font-weight: 700; color: #0f2d52; }
.source-req   { color: #4b5563; }
.source-score { color: #d1d5db; font-size: 0.75rem; margin-left: auto; }

.source-body {
  margin: 0;
  padding: 0.7rem 0.85rem;
  font-size: 0.78rem;
  font-family: 'SFMono-Regular', 'Cascadia Code', Consolas, 'Liberation Mono', monospace;
  white-space: pre-wrap;
  word-break: break-word;
  overflow-x: auto;
  max-height: 190px;
  overflow-y: auto;
  color: #374151;
  background: #fff;
  line-height: 1.55;
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>GridMind</h1>
    <p>NERC CIP compliance Q&amp;A &mdash; answers cited to the standard text</p>
  </header>

  <div class="card">
    <span class="examples-label">Example questions</span>
    <div class="examples">
      <button class="example-btn">What must a supply chain cyber security risk management plan include?</button>
      <button class="example-btn">Which systems does CIP-013 apply to?</button>
      <button class="example-btn">How often must the supply chain risk plan be reviewed?</button>
    </div>

    <textarea id="question" rows="3"
      placeholder="Ask a NERC CIP compliance question…"
      spellcheck="true"
      aria-label="Compliance question"></textarea>

    <div class="ask-row">
      <button id="ask-btn">Ask</button>
      <span id="status" aria-live="polite"></span>
    </div>

    <div id="error" hidden role="alert"></div>

    <div id="result" hidden>
      <div id="answer" aria-live="polite"></div>
      <details id="sources-details" hidden>
        <summary>Sources (<span id="source-count">0</span>)</summary>
        <div id="sources"></div>
      </details>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── wire example buttons ───────────────────────────────────────────────
  document.querySelectorAll('.example-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.getElementById('question').value = btn.textContent.trim();
      document.getElementById('question').focus();
    });
  });

  document.getElementById('question').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) ask();
  });

  document.getElementById('ask-btn').addEventListener('click', ask);

  // ── helpers ────────────────────────────────────────────────────────────
  function esc(text) {
    return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // Replace [xxxxxxxx] citation tokens with amber <mark> badges.
  // Applied after HTML-escaping so only citation brackets are ever
  // inserted as raw HTML.
  function renderCitations(html) {
    return html.replace(/\[([0-9a-f]{8})\]/gi, '<mark class="cite">[$1]</mark>');
  }

  function showError(msg) {
    var el = document.getElementById('error');
    el.textContent = msg;
    el.hidden = false;
    document.getElementById('result').hidden = true;
  }

  function hideError() {
    document.getElementById('error').hidden = true;
  }

  // Refusal (grounded=false): show the message plainly, no sources section.
  function showRefusal(msg) {
    document.getElementById('answer').innerHTML = esc(msg);
    document.getElementById('sources-details').hidden = true;
    document.getElementById('result').hidden = false;
  }

  function renderSource(src) {
    var cid = String(src.chunk_id).substring(0, 8);
    var req = src.requirement_id || '—';
    return (
      '<div class="source">' +
        '<div class="source-header">' +
          '<span class="source-rank">#' + src.rank + '</span>' +
          '<mark class="cite">[' + esc(cid) + ']</mark>' +
          '<span class="source-std">' + esc(src.standard_id) + '-' + esc(src.version) + '</span>' +
          '<span class="source-req">' + esc(req) + '</span>' +
          '<span class="source-score">score ' + Number(src.score).toFixed(4) + '</span>' +
        '</div>' +
        '<pre class="source-body">' + esc(src.body) + '</pre>' +
      '</div>'
    );
  }

  function showResult(data) {
    var answerEl  = document.getElementById('answer');
    var resultEl  = document.getElementById('result');
    var detailsEl = document.getElementById('sources-details');
    var countEl   = document.getElementById('source-count');
    var sourcesEl = document.getElementById('sources');

    // Render answer with citation badges
    answerEl.innerHTML = renderCitations(esc(data.answer));

    // Sources section
    var sources = data.sources || [];
    if (data.grounded && sources.length > 0) {
      countEl.textContent = sources.length;
      sourcesEl.innerHTML = sources.map(renderSource).join('');
      detailsEl.hidden = false;
    } else {
      detailsEl.hidden = true;
    }

    resultEl.hidden = false;
  }

  // ── main ask flow ──────────────────────────────────────────────────────
  async function ask() {
    var question = document.getElementById('question').value.trim();
    if (!question) {
      document.getElementById('question').focus();
      return;
    }

    var askBtn  = document.getElementById('ask-btn');
    var statusEl = document.getElementById('status');

    hideError();
    document.getElementById('result').hidden = true;
    askBtn.disabled = true;
    askBtn.textContent = 'Consulting the standards…';
    statusEl.textContent = '';

    // Show wake-up hint if the request takes longer than 5 s
    var wakeupTimer = setTimeout(function () {
      statusEl.textContent = 'Waking up — first question can take a moment…';
    }, 5000);

    try {
      var resp = await fetch('/answer', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question, k: 5 })
      });

      clearTimeout(wakeupTimer);
      statusEl.textContent = '';

      if (resp.status === 429) {
        var r429 = await resp.json().catch(function () { return {}; });
        showError(r429.error || 'Rate limit exceeded — try again in a minute.');
        return;
      }

      if (!resp.ok) {
        showError('The answer service is briefly busy — please try again in a moment.');
        return;
      }

      var data = await resp.json();

      if (data.error) {
        showError('The answer service is briefly busy — please try again in a moment.');
        return;
      }

      if (!data.grounded) {
        showRefusal(data.answer);
        return;
      }

      showResult(data);

    } catch (err) {
      clearTimeout(wakeupTimer);
      statusEl.textContent = '';
      showError('Could not reach the service — please check your connection and try again.');
    } finally {
      askBtn.disabled = false;
      askBtn.textContent = 'Ask';
    }
  }
}());
</script>
</body>
</html>
