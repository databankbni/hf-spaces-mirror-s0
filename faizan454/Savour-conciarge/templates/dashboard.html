<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Savour — Admin Dashboard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff8f0; color: #333; }

    .topbar { background: #c0392b; padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { color: white; font-size: 20px; }
    .topbar p { color: #ffcccc; font-size: 13px; }

    .stats { display: flex; gap: 20px; padding: 24px 32px; }
    .stat-card { background: white; border-radius: 10px; padding: 20px 24px; flex: 1; border-left: 4px solid #c0392b; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
    .stat-card h2 { font-size: 28px; font-weight: 700; color: #c0392b; }
    .stat-card p { font-size: 13px; color: #888; margin-top: 4px; }

    .section { padding: 0 32px 32px; }
    .section h3 { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 16px; }

    .ticket { background: white; border-radius: 10px; padding: 20px; margin-bottom: 12px; border: 1px solid #f5c6c6; box-shadow: 0 1px 4px rgba(0,0,0,0.04); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
    .ticket-left { flex: 1; }
    .ticket-id { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    .ticket-msg { font-size: 15px; font-weight: 600; color: #333; margin-bottom: 6px; }
    .ticket-ai { font-size: 13px; color: #888; margin-bottom: 8px; }
    .ticket-time { font-size: 12px; color: #aaa; }
    .ticket-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }

    .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 500; }
    .badge.open { background: #fff3cd; color: #856404; }
    .badge.closed { background: #d1fae5; color: #065f46; }

    .close-btn { padding: 7px 16px; background: #c0392b; color: white; border: none; border-radius: 7px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; transition: all 0.15s; }
    .close-btn:hover { background: #e74c3c; }
    .close-btn:disabled { background: #ccc; cursor: not-allowed; }

    .empty { text-align: center; padding: 3rem; color: #aaa; font-size: 14px; }
    .empty span { font-size: 40px; display: block; margin-bottom: 12px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div>
      <h1>🍽️ Savour — Admin Dashboard</h1>
      <p>Manage customer support tickets</p>
    </div>
    <a href="/" style="color:#ffcccc; font-size:13px; text-decoration:none;">← Back to Chatbot</a>
  </div>

  <div class="stats">
    <div class="stat-card">
      <h2 id="total">0</h2>
      <p>Total Tickets</p>
    </div>
    <div class="stat-card">
      <h2 id="open-count">0</h2>
      <p>Open Tickets</p>
    </div>
    <div class="stat-card">
      <h2 id="closed-count">0</h2>
      <p>Closed Tickets</p>
    </div>
  </div>

  <div class="section">
    <h3>All Tickets</h3>
    <div id="tickets-list"></div>
  </div>

<script>
async function loadTickets() {
  const res = await fetch('/tickets');
  const data = await res.json();
  const tickets = data.tickets;

  // Update stats
  document.getElementById('total').textContent = tickets.length;
  document.getElementById('open-count').textContent = tickets.filter(t => t.status === 'open').length;
  document.getElementById('closed-count').textContent = tickets.filter(t => t.status === 'closed').length;

  // Render tickets
  const list = document.getElementById('tickets-list');

  if (tickets.length === 0) {
    list.innerHTML = '<div class="empty"><span>🎉</span>No tickets yet! All customers are happy.</div>';
    return;
  }

  list.innerHTML = tickets.reverse().map(ticket => `
    <div class="ticket" id="ticket-${ticket.id}">
      <div class="ticket-left">
        <p class="ticket-id">Ticket #${ticket.id} — ${ticket.created_at}</p>
        <p class="ticket-msg">💬 "${ticket.customer_message}"</p>
        <p class="ticket-ai">🤖 ${ticket.ai_response}</p>
      </div>
      <div class="ticket-right">
        <span class="badge ${ticket.status}">${ticket.status.toUpperCase()}</span>
        ${ticket.status === 'open' ? `<button class="close-btn" onclick="closeTicket(${ticket.id})">Mark Resolved</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function closeTicket(id) {
  await fetch(`/tickets/close/${id}`, { method: 'POST' });
  loadTickets();
}

loadTickets();
</script>
</body>
</html>
