<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Upload</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="shell">
        <div class="card">

            <div class="card-head">
                <div class="card-head-text">
                    <h1>Image Upload</h1>
                    <p class="subtitle">Compress an image and get a direct link.</p>
                </div>

                <button id="theme-toggle" type="button" title="Switch appearance" aria-label="Switch appearance">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2.5 12h2M19.5 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 13.4A8.5 8.5 0 1 1 10.6 3.5a7 7 0 0 0 9.9 9.9z"/></svg>
                </button>
            </div>

            <!-- File picker -->
            <label class="file-drop" id="file-drop" for="file-input" tabindex="0">
                <input type="file" id="file-input" accept="image/*" hidden>
                <svg class="file-drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 15.5V4M12 4 8.5 7.5M12 4l3.5 3.5"/>
                    <path d="M4.5 15v3.25A1.75 1.75 0 0 0 6.25 20h11.5A1.75 1.75 0 0 0 19.5 18.25V15"/>
                </svg>
                <span id="file-label">Drop an image, or click to choose</span>
                <span class="file-drop-hint">PNG, JPG, or WEBP</span>
            </label>

            <!-- Live preview of the selected (original) image -->
            <div class="preview-wrap hidden" id="preview-wrap">
                <img id="preview" class="preview" alt="Selected image preview">
                <button type="button" class="remove-file" id="remove-file" aria-label="Remove selected image">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <!-- Settings -->
            <div class="settings">
                <div class="setting-row">
                    <label class="setting-label" for="quality">
                        <span>Quality</span>
                        <span class="setting-value" id="quality-value">80</span>
                    </label>
                    <input type="range" id="quality" min="1" max="100" value="80">
                </div>

                <div class="input-pair">
                    <div class="setting-row">
                        <label class="setting-label" for="target-size">
                            <span>Target size</span>
                            <span class="setting-value">KB</span>
                        </label>
                        <input type="number" id="target-size" value="100" min="1" inputmode="numeric">
                    </div>

                    <div class="setting-row">
                        <label class="setting-label" for="max-width">
                            <span>Max width</span>
                            <span class="setting-value">px</span>
                        </label>
                        <input type="number" id="max-width" value="1200" min="50" inputmode="numeric">
                    </div>
                </div>
            </div>

            <button id="upload-btn" type="button" disabled>
                <span id="upload-btn-label">Choose an image first</span>
            </button>

            <!-- Status / progress -->
            <p id="progress" class="progress" role="status" aria-live="polite"></p>

            <!-- Result -->
            <div id="result" class="result hidden">
                <div class="preview-wrap">
                    <img id="result-preview" class="preview" alt="Uploaded image">
                </div>

                <div class="size-compare">
                    <span class="size-before" id="size-before">—</span>
                    <span class="size-arrow">&#8594;</span>
                    <span class="size-after" id="size-after">—</span>
                    <span class="size-pct" id="size-pct">&minus;0%</span>
                </div>
                <div class="size-bar-track">
                    <div class="size-bar-fill" id="size-bar-fill"></div>
                </div>

                <div class="result-row">
                    <input type="text" id="result-url" readonly aria-label="Uploaded image URL">
                    <button id="copy-btn" type="button">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        <span id="copy-btn-label">Copy</span>
                    </button>
                </div>
                <p id="result-meta" class="result-meta"></p>
            </div>

        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
