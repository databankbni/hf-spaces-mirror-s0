plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.childmonitor'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.example.childmonitor"
        minSdk 21
        targetSdk 34
        versionCode 6
        versionName "1.1.1"
        // Prefer always-on host. Override di gradle.properties — lihat gradle.properties.example
        // Fallback HF hanya sementara; produksi: Fly/Railway (backend/DEPLOY_ALWAYS_ON.md)
        def base = (project.findProperty("DEFAULT_SERVER_URL") ?: "https://ade-basirwfrd-child-monitor-server.hf.space").toString().trim()
        if (!base.endsWith("/")) {
            base = base + "/"
        }
        buildConfigField "String", "DEFAULT_SERVER_URL", "\"${base}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Room database
    implementation 'androidx.room:room-runtime:2.5.2'
    annotationProcessor 'androidx.room:room-compiler:2.5.2'

    // Retrofit untuk HTTP
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'

    // Firebase
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'

    // WorkManager untuk periodic tasks
    implementation 'androidx.work:work-runtime:2.8.1'
}

apply plugin: 'com.google.gms.google-services'
