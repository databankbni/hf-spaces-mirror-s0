# Fly.io — always-on (anti HF Space sleep)
# Deploy: fly launch (sekali) lalu fly deploy
# Secrets: fly secrets set SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=... BREVO_API_KEY=... PUBLIC_BASE_URL=https://YOUR-APP.fly.dev FIREBASE_SERVICE_ACCOUNT='...'

app = "child-monitor-server"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
