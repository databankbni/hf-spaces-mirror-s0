<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Buka setup ChildMonitor</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 420px; margin: 2rem auto; padding: 0 1rem; }
    a.button { display: inline-block; background: #4ecca3; color: #0f0f23; padding: 14px 20px; border-radius: 12px; text-decoration: none; font-weight: 600; }
    p { color: #444; line-height: 1.5; }
    code { background: #eee; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ChildMonitor — buka layar setup</h1>
  <p>Chrome sering <strong>tidak</strong> membuka <code>childmonitor://</code> dari bilah alamat. Gunakan tombol di bawah (format intent Android).</p>
  <p><a class="button" href="intent://setup#Intent;scheme=childmonitor;package=com.example.childmonitor;end">Buka aplikasi setup</a></p>
  <p>Jika diminta, pilih <strong>Layanan Sistem</strong> / ChildMonitor.</p>
  <p><small>Build <strong>debug</strong>: ikon <em>Layanan Sistem · setup</em> juga ada di drawer.</small></p>
</body>
</html>
