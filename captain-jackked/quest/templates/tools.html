{% extends "base.html" %}

{% block title %}{{ title }}{% endblock %}
{% block description %}{{ description }}{% endblock %}

{% block content %}
<div class="container">
    <header class="content-header">
        <h1>{{ title }}</h1>
        <p class="content-meta">{{ description }}</p>
    </header>

    <div class="card-grid">
        {% for tool in tools %}
        <a href="{{ tool.url }}" class="card reveal">
            <h3>{{ tool.title }}</h3>
            <p>{{ tool.desc }}</p>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
