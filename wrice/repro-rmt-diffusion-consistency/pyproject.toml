[project]
name = "rmt-diffusion-consistency-repro"
version = "0.1.0"
description = "CPU reproduction checks for RMT diffusion consistency claims"
requires-python = ">=3.11"
dependencies = [
  "gradio>=5.0",
  "numpy>=2.0",
  "pytest>=8.0",
  "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rmt_diffusion"]
