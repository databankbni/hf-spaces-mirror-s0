[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mhc-manifold-constrained-hyper-connections"
version = "0.1.0"
description = "ICML 2026 Reproduction of mHC: Manifold-Constrained Hyper-Connections"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gradio==6.20.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
