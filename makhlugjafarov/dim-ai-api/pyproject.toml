[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dim-ai-api"
version = "0.1.0"
description = "FastAPI backend for the DIM AI Tutor migration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.0,<0.129.0",
  "httpx>=0.28.0,<1.0.0",
  "pydantic-settings>=2.8.0,<3.0.0",
  "psycopg[binary,pool]>=3.2.0,<4.0.0",
  "PyJWT[crypto]>=2.10.0,<3.0.0",
  "PyYAML>=6.0.0,<7.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "sentence-transformers>=5.0.0,<6.0.0",
  "python-multipart>=0.0.9,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<10.0.0",
  "pytest-mock>=3.14.0,<4.0.0",
  "import-linter>=2.0",
  "ruff>=0.6.7,<0.7",
  # HTML-road parsers used by the dim_html extractor. beautifulsoup4 is needed at
  # test-collection time (tests import the extractor at module level) and lxml is
  # the parser it requests (BeautifulSoup(raw, "lxml") for the XHTML bundles).
  # Both are also declared under [ingestion]; mirrored here so the default `.[dev]`
  # CI job runs the HTML-road tests without pulling the heavy ingestion stack.
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<7.0",
]
ingestion = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5.0,<7.0",
  "docling>=2.0.0,<3.0.0",
  "markdown-it-py>=3.0.0,<4.0.0",
  "ocrmypdf>=16.0.0,<18.0.0",
  "pdfplumber>=0.11.0,<1.0.0",
  "pypdf>=6.0.0,<7.0.0",
]

[project.scripts]
dim-load-pages-json = "app.ingestion.api.load_pages_json_cli:main"
dim-corpus-coverage = "app.ingestion.api.cli:corpus_coverage_main"
dim-backfill-sanitize = "app.ingestion.api.backfill_sanitize_cli:backfill_sanitize_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Pinned to ruff's current default rule set so a version bump can't silently add
# rules and break CI. E501 (line-too-long) and I (import-sort) are deliberately
# omitted: this codebase uses intentional long lines and unsorted imports, so
# enabling them would be pure churn (see GRO-148 / GRO-149).
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
