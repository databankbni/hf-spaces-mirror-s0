  normalized_sales_conversion_lift: 0.20
  normalized_turnover_lift: 0.15

selection_score_version: selection_score_time_aware_unique_unit_v3

sample_confidence:
  levels:
    - name: very_low
      max_sold_count: 2
      confidence_cap: 0.25
      note: 有效经营证据很少，只能作为观察依据
    - name: low
      min_sold_count: 3
      max_sold_count: 4
      confidence_cap: 0.40
      note: 有效经营证据偏少，结论需保守
    - name: limited
      min_sold_count: 5
      max_sold_count: 9
      confidence_cap: 0.55
      note: 有效经营证据有限，不宜仅凭单项指标主动补库
    - name: medium
      min_sold_count: 10
      max_sold_count: 19
      confidence_cap: 0.75
      note: 经营证据覆盖中等，可结合利润和周转判断
    - name: high
      min_sold_count: 20
      max_sold_count: 29
      confidence_cap: 0.90
      note: 经营证据覆盖较高，结论稳定性较好
    - name: strong
      min_sold_count: 30
      min_acquired_count: 50
      confidence_cap: 1.00
      note: 经营证据覆盖充分，结论稳定性高
  coverage_floor: 0.45
  acquired_support_reference: 50
  candidate_support_reference: 80

metric_smoothing:
  strength: 20
  fields:
    - avg_gross_profit
    - avg_turnover_days
    - turnover_efficiency_index
    - sale_conversion_rate
    - acquisition_conversion_rate
    - sold_from_acquired_rate
    - loss_rate
    - median_gross_profit

